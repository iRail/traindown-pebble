<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3aa8"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
  </defs>
  <rect width="144" height="144" fill="url(#bg)"/>
  <!-- metro line: down, a 45 degree bend, then along -->
  <g transform="translate(0 -4)">
    <path d="M34 40 V72 L66 104 H110" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- start, a change on the bend, destination -->
    <circle cx="34" cy="40" r="15" fill="#ffffff"/>
    <circle cx="34" cy="40" r="7" fill="#0d2a85"/>
    <circle cx="50" cy="88" r="14" fill="#fae042"/>
    <circle cx="50" cy="88" r="6" fill="#0d2a85"/>
    <circle cx="110" cy="104" r="15" fill="#ffffff"/>
    <circle cx="110" cy="104" r="7" fill="#ed2939"/>
  </g>
  <!-- Belgian colours -->
  <rect y="134" width="48" height="10" fill="#000000"/>
  <rect x="48" y="134" width="48" height="10" fill="#fae042"/>
  <rect x="96" y="134" width="48" height="10" fill="#ed2939"/>
</svg>
